<!-- You might want to add additional HTML elements to ST.
    It's good practice to separate it out from your code -->
<div class="example-extension-settings">
  <div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
      <b>CHARacter MANager DERedere</b>
      <div
        class="inline-drawer-icon fa-solid fa-circle-chevron-down down"
      ></div>
    </div>
    <div class="inline-drawer-content">
      <div
        class="example-extension_block flex-container flexFlowColumn gap10h5v"
      >
        <div class="flex-container flexFlowColumn">
          <div class="title_restorable">
            <span>Descriptions prompt</span>
            <button
              id="reset-descriptions-prompt"
              class="menu_button"
              type="button"
              title="Reset prompt to default"
            >
              <i class="fa-solid fa-rotate-left"></i>
            </button>
          </div>
          <textarea
            id="descriptions_prompt"
            class="text_pole"
            rows="10"
          ></textarea>
        </div>
      </div>

      <div
        class="example-extension_block flex-container flexFlowColumn gap10h5v"
      >
        <div class="custom-fields-settings">
          <div class="custom-fields-settings__title">Additional fields</div>
          <div id="custom-fields-list" class="custom-fields-list"></div>
          <button
            id="custom-fields-add"
            class="menu_button custom-fields-settings__add-button"
            type="button"
          >
            <i class="fa-solid fa-plus"></i><span>Add field</span>
          </button>
        </div>
      </div>

      <div
        class="example-extension_block flex-container flexFlowColumn gap10h5v"
      >
        <label class="checkbox_label" for="show_image_generation_buttons">
          <input id="show_image_generation_buttons" type="checkbox" />
          <span>Show image generation buttons</span>
        </label>
        <label class="checkbox_label" for="show_mods_panel">
          <input id="show_mods_panel" type="checkbox" />
          <span>Show mods panel</span>
        </label>
        <label
          class="checkbox_label"
          for="auto_add_persona_character_for_new_chat"
        >
          <input id="auto_add_persona_character_for_new_chat" type="checkbox" />
          <span>Auto-add persona character for new chat, if exists</span>
        </label>
        <label
          for="switcher_character_limit"
          class="flex-container flexFlowColumn"
        >
          <span>Switcher character limit</span>
          <input
            id="switcher_character_limit"
            class="text_pole"
            type="number"
            min="1"
            max="50"
            step="1"
          />
        </label>
        <label
          for="llm_history_message_limit"
          class="flex-container flexFlowColumn"
        >
          <span
            >LLM chat history: keep last N assistant replies (+ messages
            between); 0 = unlimited</span
          >
          <input
            id="llm_history_message_limit"
            class="text_pole"
            type="number"
            min="0"
            max="200"
            step="1"
          />
        </label>
        <label class="checkbox_label" for="llm_clothing_plain_text">
          <input id="llm_clothing_plain_text" type="checkbox" />
          <span>Attach clothing to LLM as plain text (instead of JSON)</span>
        </label>
        <div class="flex-container flexFlowColumn">
          <div class="title_restorable">
            <span id="clothing_interpretation_prompt_label"
              >Clothing interpretation prompt (JSON)</span
            >
            <button
              id="reset-clothing-interpretation-prompt"
              class="menu_button"
              type="button"
              title="Reset prompt to default"
            >
              <i class="fa-solid fa-rotate-left"></i>
            </button>
          </div>
          <textarea
            id="clothing_interpretation_prompt"
            class="text_pole"
            rows="9"
          ></textarea>
        </div>
        <label class="checkbox_label" for="use_crop_tool_for_avatars">
          <input id="use_crop_tool_for_avatars" type="checkbox" />
          <span>Use crop tool for avatars</span>
        </label>
        <label class="checkbox_label" for="remove_image_prompt_newlines">
          <input id="remove_image_prompt_newlines" type="checkbox" />
          <span>Remove newlines from image prompt</span>
        </label>
        <div
          id="image-generation-required-note"
          class="custom-settings-note displayNone"
        >
          Required: Image Generation built-in extension (Optional modules: sd).
        </div>
        <div class="flex-container flexFlowColumn">
          <div class="title_restorable">
            <span>Visual command start</span>
            <button
              id="reset-visual-command-start-prompt"
              class="menu_button"
              type="button"
              title="Reset prompt to default"
            >
              <i class="fa-solid fa-rotate-left"></i>
            </button>
          </div>
          <textarea
            id="visual_command_start"
            class="text_pole"
            rows="8"
          ></textarea>
        </div>
        <div class="generation-style-settings">
          <div class="generation-style-settings__selector-row">
            <select
              id="generation-style-select"
              class="text_pole"
              aria-label="Generation style"
            ></select>
            <button id="generation-style-add" class="menu_button" type="button">
              <i class="fa-solid fa-plus"></i><span>Add style</span>
            </button>
          </div>
          <div
            id="generation-style-panel"
            class="generation-style-settings__panel"
          ></div>
        </div>

        <div class="custom-fields-settings">
          <div class="custom-fields-settings__title">Quick resolutions</div>
          <label class="checkbox_label" for="show_quick_resolution_button">
            <input id="show_quick_resolution_button" type="checkbox" />
            <span>Add quick resolution button</span>
          </label>
          <div id="quick-resolutions-list" class="custom-fields-list"></div>
          <button
            id="quick-resolutions-add"
            class="menu_button custom-fields-settings__add-button"
            type="button"
          >
            <i class="fa-solid fa-plus"></i><span>Add resolution</span>
          </button>
        </div>
      </div>

      <hr class="sysHR" />
    </div>
  </div>
</div>
